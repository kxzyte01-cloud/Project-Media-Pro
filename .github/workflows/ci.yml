name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Guard against forbidden secret files
        run: |
          set -euo pipefail
          FOUND=$(find . -type f \( -name "*.jks" -o -name "*.keystore" -o -name "*.p12" -o -name "*.pfx" -o -name "*.pem" -o -name "google-services.json" -o -name "local.properties" \) -print -quit)
          if [ -n "$FOUND" ]; then
            echo "Error: Forbidden secret or keystore file found in repository: $FOUND"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.5.0"
          cache-provider: basic

      - name: Run Lint, Unit Tests, and Assemble Debug + Release APKs
        run: gradle lintDebug :core:model:test testDebugUnitTest assembleDebug assembleRelease

      - name: Guard against INTERNET permission in debug and release APKs
        run: |
          set -euo pipefail
          AAPT2=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name aapt2 2>/dev/null | sort -V | tail -n 1)
          test -x "$AAPT2"
          for APK_PATH in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk; do
            test -f "$APK_PATH"
            PERMS=$("$AAPT2" dump permissions "$APK_PATH")
            if grep -q "android.permission.INTERNET" <<< "$PERMS"; then
              echo "Error: $APK_PATH requests android.permission.INTERNET, violating the offline privacy rule."
              exit 1
            fi
          done

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: project-media-pro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
