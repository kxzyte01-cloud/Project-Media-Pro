name: Build APK and publish tester release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

concurrency:
  group: project-media-pro-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Verify and build APKs
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle 9.6.0
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: "9.6.0"
          cache-provider: basic

      - name: Guard against committed secrets and binaries
        shell: bash
        run: |
          set -euo pipefail
          forbidden=$(find . -type f \( -name "*.jks" -o -name "*.keystore" -o -name "*.p12" -o -name "*.pfx" -o -name "*.pem" -o -name "google-services.json" -o -name "local.properties" -o -name "gradle-wrapper.jar" \) -print -quit)
          if [[ -n "$forbidden" ]]; then
            echo "Forbidden secret or binary file found: $forbidden"
            exit 1
          fi

      - name: Run lint, all unit tests, and APK builds
        run: |
          gradle lintDebug \
            :core:model:test \
            :core:designsystem:testDebugUnitTest \
            :app:testDebugUnitTest \
            :app:assembleDebug \
            :app:assembleRelease

      - name: Verify offline permission policy in APKs
        shell: bash
        run: |
          set -euo pipefail
          aapt2=$(find "${ANDROID_HOME:-/usr/local/lib/android/sdk}/build-tools" -name aapt2 -type f | sort -V | tail -n 1)
          test -x "$aapt2"
          for apk in app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/release/app-release-unsigned.apk; do
            test -f "$apk"
            if "$aapt2" dump permissions "$apk" | grep -q "android.permission.INTERNET"; then
              echo "Unexpected INTERNET permission in $apk"
              exit 1
            fi
          done

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: project-media-pro-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish versioned tester release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - name: Download verified debug APK
        uses: actions/download-artifact@v4
        with:
          name: project-media-pro-debug-apk
          path: release-assets

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            release-assets/app-debug.apk \
            --title "Project Media Pro ${GITHUB_REF_NAME} (tester build)" \
            --generate-notes
